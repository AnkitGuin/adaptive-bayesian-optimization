# =============================================================================
# Experiment matrices.  Each study lists (benchmark, scenario) combinations,
# noise levels and the method set.  All methods of one (study, seed) share
# the same benchmark state path and noise draws (spec §22).
# =============================================================================

stationary:
  benchmarks: [peak, multimodal, peak2d]
  scenarios: [stationary]
  noises: [low, medium, high]
  methods: [random_search, static_ei, static_ucb, static_pi, exploitation, abo, dabo]

drift:
  studies:
    slow:
      combos:
        - {benchmark: peak, scenario: slow}
        - {benchmark: peak2d, scenario: slow}
      noises: [medium]
      methods: [random_search, static_ucb, abo, dabo]
    abrupt:
      combos:
        - {benchmark: peak, scenario: abrupt}
        - {benchmark: peak2d, scenario: abrupt}
      noises: [medium]
      methods: [random_search, static_ucb, static_ei, abo, dabo]
    random_walk:
      combos:
        - {benchmark: peak, scenario: random_walk}
      noises: [medium]
      methods: [random_search, static_ucb, abo, dabo]
    noise_shift:
      combos:
        - {benchmark: peak, scenario: noise_shift}
      noises: [null]            # noise schedule is inside the scenario
      methods: [random_search, static_ucb, abo, dabo]
    multimodal_switch:
      combos:
        - {benchmark: multimodal, scenario: switch}
      noises: [medium]
      methods: [random_search, static_ucb, abo, dabo]

ablation:
  # component ablations (spec §29) on the abrupt scenario (worst case for drift)
  combos:
    - {benchmark: peak, scenario: abrupt}
    - {benchmark: peak2d, scenario: abrupt}
  noise: medium
  methods:
    full: {}
    no_forgetting: {no_forgetting: true}
    no_drift_detection: {no_drift_detection: true}
    no_exploration_boost: {no_exploration_boost: true}
    no_memory_shortening: {no_memory_shortening: true}
  half_life_sweep: [8, 16, 32, 64, 128, inf]     # Ablation D
  threshold_sweep: [10, 25, 50, 100]             # Ablation E
  recovery_sweep: [10, 20, 40]                   # Ablation F

sensitivity:
  beta_sweep:        [1.0, 2.0, 4.0, 8.0]        # on slow peak (1D)
  budget_sweep:      [50, 100, 150]              # on abrupt peak + peak2d
  n_initial_sweep:   [6, 10, 16]                 # on slow peak (1D)
  noise_sweep:       [low, medium, high, very_high]  # on abrupt peak
  drift_sweep:       # random-walk drift magnitudes (peak 1D)
    - {type: random_walk, sigma_drift: 0.004, start: 0.50}
    - {type: random_walk, sigma_drift: 0.008, start: 0.50}
    - {type: random_walk, sigma_drift: 0.016, start: 0.50}
  kernel_sweep:      [matern52, matern32, rbf]   # on slow peak, static_ucb/abo/dabo
  methods_beta:      [static_ucb, dabo]
  methods_budget:    [static_ucb, dabo]
  methods_noise:     [static_ucb, dabo]
  methods_kernel:    [static_ucb, abo, dabo]

application:
  benchmark: process
  budget: 80
  n_initial: 12
  noise_std: 1.0
  methods: [random_search, static_ei, static_ucb, abo, dabo]
  seeds: 10
